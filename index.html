.thinking .orb{animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wordmark{display:block;height:16px;width:auto}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none}
header .status{margin-left:auto;font-size:13px;color:var(--muted)}

#feed{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:24px 20px 12px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;max-width:280px;padding-bottom:40px}
.empty .orb{width:84px;height:84px;margin:0 auto 14px}
.empty .wordmark{height:24px;margin:0 auto 18px}
.empty p{margin:0;color:var(--muted);font-size:17px;line-height:1.45}

.msg-user{align-self:flex-end;max-width:82%;background:var(--user);color:var(--user-ink);padding:11px 16px;border-radius:20px 20px 6px 20px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg-bot{display:flex;gap:12px;align-items:flex-start;max-width:94%}
.msg-bot .orb{width:26px;height:26px;margin-top:0}
.msg-bot .text{font-size:17px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-wrap:break-word;padding-top:1px}
.msg-bot.thinking .text{display:none}

footer{padding:10px 16px 14px}
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 18px}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:16px/1.4 var(--sans);padding:9px 0;max-height:120px;min-height:24px}
textarea::placeholder{color:var(--muted)}
button.send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--lime);color:#1E3A3A;display:grid;place-items:center;cursor:pointer;transition:transform .15s,opacity .15s}
button.send:active{transform:scale(.92)}
button.send:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.send[disabled]{opacity:.35}
.fine{margin:8px 0 0;text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.thinking .orb{animation:none}#feed{scroll-behavior:auto}}
</style>

  const d = document.createElement("div");
  d.className = "msg-user"; d.textContent = text;
  feed.appendChild(d); toBottom();
}
function addBot(){
  const row = document.createElement("div");
  row.className = "msg-bot thinking";
  row.innerHTML = '<div class="orb"></div><div class="text"></div>';
  feed.appendChild(row); toBottom();
  return row;
}
async function reply(){
  busy = true; sync();
  const line = SCRIPT[turn] ? SCRIPT[turn].b : FALLBACK[(turn - SCRIPT.length) % FALLBACK.length];
  const row = addBot();
  await delay(1300 + Math.random() * 700);
  row.classList.remove("thinking");
  const box = row.querySelector(".text");
  const words = line.split(/(\s+)/);
  for (const w of words){
    box.textContent += w;
    toBottom();
    await delay(/\s/.test(w) ? 0 : 28 + Math.random() * 40);
  }
  turn++; busy = false; sync();
}
function send(){
  if (busy) return;
  let text = ta.value.trim();
  if (!text && !free && SCRIPT[turn]) text = SCRIPT[turn].u;
  if (!text) return;
  addUser(text);
  ta.value = ""; ghost = 0; fit(); sync();
  reply();
}
function sync(){ go.disabled = busy || (free && !ta.value.trim()); }
function fit(){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; }

/* ghost typing: whatever keys are tapped, the scripted line appears */
let prevLen = 0;
ta.addEventListener("input", () => {
  if (!free && SCRIPT[turn]){
    const full = SCRIPT[turn].u, len = ta.value.length;
    ghost = len > prevLen ? Math.min(ghost + 1, full.length) : Math.max(ghost - 1, 0);
    ta.value = full.slice(0, ghost);
  }
  prevLen = ta.value.length; fit(); sync();
});
go.addEventListener("click", send);
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

/* hidden controls on the "Camus" title:
   triple-tap = toggle free typing (silent) · hold 1.5s = reset conversation */
const head = $("head"); let taps = 0, tapTimer, holdTimer;
head.addEventListener("click", () => {
  taps++; clearTimeout(tapTimer);
  tapTimer = setTimeout(() => taps = 0, 500);
  if (taps >= 3){ free = !free; taps = 0; ta.value = ""; ghost = 0; prevLen = 0; sync(); }
});
const hold = () => { holdTimer = setTimeout(() => location.reload(), 1500); };
const release = () => clearTimeout(holdTimer);
head.addEventListener("touchstart", hold, {passive:true});
head.addEventListener("touchend", release);
head.addEventListener("touchcancel", release);

/* keep layout above the on-screen keyboard */
if (window.visualViewport){
  const vv = window.visualViewport;
  const resize = () => { document.documentElement.style.height = vv.height + "px"; window.scrollTo(0, 0); toBottom(); };
  vv.addEventListener("resize", resize);
}
</script>
